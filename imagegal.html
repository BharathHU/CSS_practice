<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            background-image: url(https://www.pixelstalk.net/wp-content/uploads/2016/07/Free-Amazing-Background-Images-Nature.jpg);
            background-color: rgb(241, 238, 234);
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            flex-wrap: wrap;
        }
        header{
            border: 2px solid black;
            background-color:aquamarine;
            margin-bottom: 10px;
            color:black;
            font-family: Arial, Helvetica, sans-serif;
            border-radius: 15px;
        
        }
        section{
            display: grid;
        }
        .one{
            border: 2px solid red;
            height: 490px;
            width: 200px;
            padding-bottom: 10px;
            grid-template-rows: 200px 300px 200px;
             gap: 10px;
           
        }
        .two{
            display: grid;
            grid-template-columns: 200px 200px 200px;
            gap: 10px;
            margin-top: 10px;
            border: 2px solid yellow;
            height: 200px;
            width: 200px;
            margin-bottom: 10px;
        }
        .col{
            display: grid;
            grid-template-columns: 200px 200px 200px;
            gap: 10px;
        }
        .six{
            margin: 100px auto;
        }
        .seven{
            height: 200px;
            width: 200px;
            margin: 100px auto;
                }
                .ff{
                    border: 3px solid black;
                    background-color: aquamarine;
                    border-radius: 15px;
                }
    </style>
</head>
<body>
    <header>
        <h1 class="header"><center>Image Gallery</center></h1>
    </header>
    <section>
    <div class="one">
        <img src="car.jpg" alt="" height="500px" width="200px">
    </div>
     <div class="two">
        <img src="car.jpg" alt="" height="200px" width="200px">
     </div>
    </section>
    <section class="col">
         <div class="three">
        <img src="car.jpg" alt="" height="200px" width="200px">
    </div>
     <div class="four">
        <img src="car.jpg" alt="" height="200px" width="200px">
    </div>
     <div class="five">
        <img src="car.jpg" alt="" height="200px" width="200px">
    </div>
     
    </section>
    <div class="six">
        <center><img src="car.jpg" alt="" height="300px" width="300px">
    </div></center>
    <div class="seven">
        <img src="car.jpg" alt="" height="200px" width="200px">
    </div>
    
    <center><footer class="ff"><h1>&copy;Copy rights @2026</h1></footer></center>
</body>
</html>
