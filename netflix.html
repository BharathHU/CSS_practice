<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Netflix</title>

<style>

body{
    margin: 0px;
    background-color:black;height: 100%;width: 100%;
    font-family: Arial, Helvetica, sans-serif;
    background-image: url(https://i.pinimg.com/1200x/36/d3/92/36d39247289fa60ad6c51a6d5b29f7cc.jpg);
    background-size:cover;
}
header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:20px 40px;
    position:absolute;
    width:100%;
    box-sizing:border-box;
    top:0;
    left:0;
}

.logo{
    color:#e50914;
    font-size:32px;
    font-weight:bold;
}

.signin{
    background:#e50914;
    color:white;
    border:none;
    padding: 8px 16px;
    border-radius:4px;
    cursor:pointer;
}
.English{
    padding: 8px 16px;
    border-radius:4px;
    cursor:pointer;
    align-items: end;
    margin-left: 77%;

}
main{
    height:100vh;
    width:100%;
    background-image:linear-gradient(rgba(9,9,9,0.6),rgba(0,0,0,0.6)),url("img/netflix.jpg");
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    color:white;
}

.hero h1{
    font-size:50px;
    margin:10px 0;
}

.hero h3{
    font-size:20px;
    font-weight:normal;
}
.small{
    margin-top:10px;
    font-size:14px;
}

</style>
</head>

<body>

<header>
    <div class="logo">NETFLIX</div>
    <button class="English">English</button>
    <button class="signin">Sign In</button>
</header>

<main>
    <div class="hero">
        <h1>Unlimited movies, TV</h1>
        <h1>shows and more.</h1>
        <h3>Watch anywhere. Cancel anytime.</h3>
        <div class="small">
            Ready to watch? Enter your email to create or restart your membership.
        </div>
    </div>
</main>
</body>
</html>
