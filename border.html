<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

.one{
    height: 200px;
    width: 200px;
    border: 5px solid red;
    outline: dashed;
    outline-offset: 50px;
    border-radius: 30px 20px 30px 20px;
}
input{
    height: 40px;
    width: 120px;
    outline: 5px solid green;
    border: 5px dotted rgb(244, 216, 9);
    outline-offset: 30px;
    border-radius: 2px;
    box-shadow: 0px 0px 3px 1px;
}
.two{
    background-color: aqua;
    border: 2px solid black;
    height: fit-content;
    width: fit-content;
    border-radius: 5px;
    border: color(srgb red green blue);
}
.three{
    background-color: aqua;
    border: 2px solid black;
    height: fit-content;
}
    </style>
</head>
<body>
     <br><br><br><br>
    <center>
  <div class="one">
    <br><br><br><br>
        <input type="text" placeholder="enter text here">
    </div>
    </center>
    <br>
    <br>

    <center>
        <h2 class="two">Welcome to Karnataka</h2>
    </center>
    <h2 class="three">Welcome to Bengaluru</h2>
</body>
</html>
