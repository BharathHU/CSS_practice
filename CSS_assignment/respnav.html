<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Facebook Login Animated</title>
  <style>
    :root {
      --fb-blue: #1877f2;
      --fb-blue-dark: #1664d9;
      --fb-green: #42b72a;
      --fb-green-dark: #36a420;
      --text-main: #1c1e21;
      --border: rgba(255, 255, 255, 0.35);
      --card-bg: rgba(255, 255, 255, 0.18);
      --card-stroke: rgba(255, 255, 255, 0.35);
      --shadow: 0 20px 50px rgba(0, 0, 0, 0.18);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      font-family: Helvetica, Arial, sans-serif;
      color: var(--text-main);
      overflow: hidden;
      position: relative;
      background: linear-gradient(-45deg, #dbe7ff, #bfd4ff, #d7e2ff, #eef3ff);
      background-size: 400% 400%;
      animation: gradientMove 16s ease infinite;
    }

    .bg-blur {
      position: absolute;
      border-radius: 50%;
      filter: blur(50px);
      opacity: 0.55;
      z-index: 0;
      animation: float 10s ease-in-out infinite;
    }

    .bg1 {
      width: 320px;
      height: 320px;
      background: rgba(24, 119, 242, 0.28);
      top: -60px;
      left: -70px;
    }

    .bg2 {
      width: 280px;
      height: 280px;
      background: rgba(66, 183, 42, 0.16);
      bottom: -50px;
      right: -60px;
      animation-delay: 2s;
    }

    .bg3 {
      width: 220px;
      height: 220px;
      background: rgba(255, 255, 255, 0.4);
      top: 55%;
      left: 12%;
      animation-delay: 4s;
    }

    .page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 80px;
      padding: 32px 20px;
      position: relative;
      z-index: 1;
    }

    .left {
      max-width: 520px;
      animation: fadeLeft 1s ease;
    }

    .logo-row {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 18px;
    }

    .logo-badge {
      width: 76px;
      height: 76px;
      border-radius: 24px;
      background: linear-gradient(145deg, #2a84f7, #1664d9);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 16px 32px rgba(24, 119, 242, 0.28);
      animation: pulse 3s ease-in-out infinite;
    }

    .logo-f {
      color: #fff;
      font-size: 52px;
      font-weight: bold;
      font-family: Arial, Helvetica, sans-serif;
      line-height: 1;
      transform: translateY(2px);
    }

    .brand {
      font-size: 3.8rem;
      font-weight: 700;
      letter-spacing: -1px;
      color: var(--fb-blue);
      line-height: 1;
    }

    .left p {
      font-size: 1.7rem;
      line-height: 1.28;
      max-width: 470px;
      color: #24334d;
    }

    .right {
      width: 100%;
      max-width: 400px;
      animation: fadeUp 1s ease;
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-stroke);
      border-radius: 22px;
      padding: 20px;
      box-shadow: var(--shadow);
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.28), rgba(255,255,255,0.04));
      pointer-events: none;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 13px;
      position: relative;
      z-index: 1;
    }

    input {
      width: 100%;
      padding: 15px 16px;
      font-size: 17px;
      border: 1px solid rgba(200, 210, 230, 0.8);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.78);
      transition: 0.3s ease;
    }

    input:focus {
      outline: none;
      border-color: var(--fb-blue);
      box-shadow: 0 0 0 4px rgba(24, 119, 242, 0.14);
      transform: translateY(-1px);
    }

    button {
      border: none;
      border-radius: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.3s ease;
    }

    .login-btn {
      background: linear-gradient(135deg, var(--fb-blue), var(--fb-blue-dark));
      color: #fff;
      font-size: 20px;
      padding: 13px;
      box-shadow: 0 12px 22px rgba(24, 119, 242, 0.22);
    }

    .login-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 16px 28px rgba(24, 119, 242, 0.28);
    }

    .forgot {
      text-align: center;
      color: var(--fb-blue);
      text-decoration: none;
      font-size: 14px;
      margin-top: 2px;
    }

    .forgot:hover {
      text-decoration: underline;
    }

    .divider {
      height: 1px;
      background: linear-gradient(to right, transparent, rgba(120, 140, 180, 0.35), transparent);
      margin: 8px 0 10px;
    }

    .create-btn {
      align-self: center;
      width: fit-content;
      background: linear-gradient(135deg, var(--fb-green), var(--fb-green-dark));
      color: #fff;
      font-size: 17px;
      padding: 13px 18px;
      box-shadow: 0 10px 20px rgba(66, 183, 42, 0.18);
    }

    .create-btn:hover {
      transform: translateY(-2px);
    }

    .page-text {
      text-align: center;
      font-size: 14px;
      margin-top: 24px;
      color: #22314a;
    }

    .page-text strong {
      color: #111;
    }

    @keyframes gradientMove {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    @keyframes float {
      0%, 100% { transform: translateY(0) translateX(0); }
      50% { transform: translateY(-20px) translateX(10px); }
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    @keyframes fadeLeft {
      from {
        opacity: 0;
        transform: translateX(-35px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(35px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 900px) {
      body {
        overflow-y: auto;
      }

      .page {
        flex-direction: column;
        text-align: center;
        gap: 36px;
      }

      .logo-row {
        justify-content: center;
      }

      .brand {
        font-size: 3rem;
      }

      .left p {
        font-size: 1.3rem;
      }
    }

    @media (max-width: 480px) {
      .page {
        padding: 24px 14px;
      }

      .logo-badge {
        width: 64px;
        height: 64px;
        border-radius: 18px;
      }

      .logo-f {
        font-size: 44px;
      }

      .brand {
        font-size: 2.4rem;
      }

      .left p {
        font-size: 1.05rem;
      }

      .card {
        padding: 15px;
        border-radius: 16px;
      }

      input {
        font-size: 15px;
        padding: 13px 14px;
      }

      .login-btn {
        font-size: 18px;
      }

      .create-btn {
        font-size: 15px;
      }

      .bg3 {
        display: none;
      }
    }
  </style>
</head>
<body>
  <div class="bg-blur bg1"></div>
  <div class="bg-blur bg2"></div>
  <div class="bg-blur bg3"></div>

  <main class="page">
    <section class="left">
      <div class="logo-row">
        <div class="logo-badge">
          <span class="logo-f">f</span>
        </div>
        <div class="brand">facebook</div>
      </div>
      <p>Facebook helps you connect and share with the people in your life.</p>
    </section>

    <section class="right">
      <div class="card">
        <form>
          <input type="text" placeholder="Email address or phone number" />
          <input type="password" placeholder="Password" />
          <button type="submit" class="login-btn">Log in</button>
          <a href="#" class="forgot">Forgotten password?</a>
          <div class="divider"></div>
          <button type="button" class="create-btn">Create new account</button>
        </form>
      </div>
      <p class="page-text"><strong>Create a Page</strong> for a celebrity, brand or business.</p>
    </section>
  </main>
</body>
</html>
